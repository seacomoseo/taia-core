name: Astro Cloudflare Reusable

on:
  workflow_call:
    inputs:
      node_version:
        description: Node.js version
        required: false
        type: string
        default: '20'
      pnpm_version:
        description: pnpm version
        required: false
        type: string
        default: '9'
      build_directory:
        description: Build output directory
        required: false
        type: string
        default: 'dist'
      project_name:
        description: Cloudflare Pages project name
        required: false
        type: string
        default: ''
      run_deploy:
        description: Whether deploy job should run
        required: false
        type: boolean
        default: true
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ inputs.pnpm_version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: quality
    if: ${{ inputs.run_deploy && github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    env:
      CF_PROJECT_NAME: ${{ inputs.project_name != '' && inputs.project_name || vars.CLOUDFLARE_PAGES_PROJECT || github.event.repository.name }}

    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ inputs.pnpm_version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ env.CF_PROJECT_NAME }}
          directory: ${{ inputs.build_directory }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
